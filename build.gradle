plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
    id "org.asciidoctor.jvm.convert" version "3.3.2"    // Asciidoctor 파일을 컨버팅 후, Build 폴더에 복사하기 위한 플러그인 적용
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    asciidoctorExt  // Asciidoctor를 확장하는 종속성에 대한 설정

    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //Jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // WebClient
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // AWS
    implementation 'io.awspring.cloud:spring-cloud-starter-aws:2.4.4'
    testImplementation 'io.findify:s3mock_2.12:0.2.4'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'mysql:mysql-connector-java:8.0.32'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-web-services'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:mongodb'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // REST Docs
    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'   // 문서 포맷
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'   // REST Docs를 MockMvc로 사용
}

tasks.named('test') {
    useJUnitPlatform()
}

ext {
    snippetsDir = file('build/generated-snippets')  // snippet의 출력 위치
}

test {
    outputs.dir snippetsDir // test 작업의 출력 위치
}

asciidoctor {
    inputs.dir snippetsDir  // 생성된 snippet의 출력 위치 정의
    configurations 'asciidoctorExt' // 확장을 위한 asciidoctorExt 사용을 설정
    dependsOn test  // test 실행 후에 문서 작성
}

/* jar 파일명 설정 */
bootJar {
    archiveBaseName = 'molecularsearch'
    archiveFileName = 'canchem.jar'
    archiveVersion = '0.0.1'

    dependsOn asciidoctor   // 문서 작성 후에 .jar 생성
    from ("${asciidoctor.outputDir}/html5") {   // "./build/asciidoc/outputDir/html5/"에 html 파일 생성됨
        into 'static/docs'  // .jar의 static/docs 폴더에 복사됨
    }
}
